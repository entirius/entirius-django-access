
[project]
name = "entirius-django-access"
version = "0.1.0"
description = "Staff roles and permissions per module area, an admin API gate, and hashed application tokens for the Volkanos platform"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=5.1",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "entirius-django-utils>=2.2.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "psycopg[binary]>=3.1", "dj-database-url>=2.0"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-access"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_access"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]
"tests/legacy_apps/**" = ["DJ008"]

[tool.ruff.lint.isort]
known-first-party = ["django_access"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-rs"  # name every skip: the local sqlite run skips the Postgres-only lockout race

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
