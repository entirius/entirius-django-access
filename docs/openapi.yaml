          examples:
          - 12
          title: Age Days
          type: integer
        rotation_due:
          description: 'Active and at least `token_rotation_days` old: rotate it.
            A recommendation — nothing is refused.'
          title: Rotation Due
          type: boolean
        raw:
          description: The token value — in this response only; store it now, it is
            never shown again.
          examples:
          - ent_api_<shown once>
          title: Raw
          type: string
      required:
      - id
      - name
      - prefix
      - last_four
      - scopes
      - channel_idx
      - expires_at
      - last_used_at
      - revoked_at
      - legacy
      - legacy_source
      - state
      - age_days
      - rotation_due
      - raw
      title: TokenSecretResponse
      type: object
    UserRef:
      properties:
        id:
          title: Id
          type: integer
        username:
          title: Username
          type: string
      required:
      - id
      - username
      title: UserRef
      type: object
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
