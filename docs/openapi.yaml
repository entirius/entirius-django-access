# Generated from the module urlconf (manage.py spectacular --urlconf django_access.urls, tests.settings) — regenerate with the API.
openapi: 3.1.0
info:
  title: django-access Admin API v2
  version: 2.0.0
paths:
  /api/access/v2/admin/applications/:
    get:
      operationId: access_applications_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Applications by name
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - Access Applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    post:
      operationId: admin_applications_create
      description: 409 for a name in use.
      summary: Create an application
      tags:
      - Access Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/applications/{id}/:
    get:
      operationId: admin_applications_retrieve
      description: '``access.manage``: read for GET, write otherwise.'
      summary: One application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: admin_applications_partial_update
      description: Only `name`, `description` and `is_active`; no DELETE — deactivate
        instead. 409 for a name in use.
      summary: Rename, describe, activate or deactivate an application
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/applications/{id}/tokens/:
    get:
      operationId: access_tokens_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: An application's tokens, newest first (never their values)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - Access Tokens
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    post:
      operationId: admin_applications_tokens_create
      description: 'The raw value is in this response only (`Cache-Control: no-store`).
        Unknown scope, mixed publishable and secret scopes → 400.'
      summary: Issue a token
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSecretResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/audit/:
    get:
      operationId: access_audit_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Audit entries, newest first
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
        description: Actor user id.
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Created at or after (ISO 8601 with offset).
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Created at or before (ISO 8601 with offset).
      tags:
      - Access Audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/access/v2/admin/catalogue/:
    get:
      operationId: access_catalogue
      description: 'Staff baseline: any active staff user.'
      summary: Areas by module, the built-in roles with their computed permissions,
        and the token scopes
      tags:
      - Access Catalogue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/access/v2/admin/grants/:
    get:
      operationId: access_grants_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Grants, filterable by role key, user and group
      parameters:
      - in: query
        name: group_id
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
      - in: query
        name: user_id
        schema:
          type: integer
      tags:
      - Access Grants
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    post:
      operationId: admin_grants_create
      description: Exactly one of `user_id` and `group_id`; a user who is not active
        staff → 400; a duplicate → 409.
      summary: Grant a role to one active staff user or one group
      tags:
      - Access Grants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/grants/{id}/:
    delete:
      operationId: admin_grants_destroy
      description: 409 when nobody active would be left to manage access.
      summary: Revoke a grant
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Grants
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/groups/:
    get:
      operationId: access_groups_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Groups with member counts and grants
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - Access Staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/access/v2/admin/roles/:
    get:
      operationId: access_roles_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Built-in and custom roles with grant counts
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      tags:
      - Access Roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    post:
      operationId: admin_roles_create
      description: 400 ACCESS_MANAGE_RESERVED for any access.manage key; 409 for a
        key in use (built-in included).
      summary: Create a custom role
      tags:
      - Access Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/roles/{id}/:
    get:
      operationId: admin_roles_retrieve
      description: '``access.manage``: read for GET, write otherwise.'
      summary: One role with its effective permissions
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Roles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: admin_roles_partial_update
      description: '`permissions` replaces the whole set. Built-in roles and lockout
        → 409; access.manage → 400.'
      summary: Update a custom role
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
    delete:
      operationId: admin_roles_destroy
      description: Built-in roles and lockout → 409.
      summary: Delete a custom role with its grants
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Roles
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/staff/:
    get:
      operationId: access_staff_list
      description: '``access.manage``: read for GET, write otherwise.'
      summary: Active staff users with their roles (direct and through groups)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Access Staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    post:
      operationId: access_staff_create
      description: 'Never a superuser. No `password` → one is generated and returned
        in this response only (`Cache-Control: no-store`); a given password is never
        echoed. Taken username or e-mail (any case) → 409; unknown role, invalid field
        or a password the validators refuse → 400 on that field.'
      summary: Create an active staff account with one role
      tags:
      - Access Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffCreateResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/staff/{user_id}/:
    get:
      operationId: admin_staff_retrieve
      description: '``access.manage``: read for GET, write otherwise.'
      summary: One active staff user with groups and grants
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Access Staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/access/v2/admin/tokens/{id}/expiry/:
    post:
      operationId: admin_tokens_expiry_create
      description: Audited `token.expiry`. Legacy keys never expire by themselves;
        a team sets or clears it here.
      summary: Set or clear a token's expiry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenExpiryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExpiryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenExpiryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/admin/tokens/{id}/revoke/:
    post:
      operationId: admin_tokens_revoke_create
      description: 'Idempotent: an already revoked token answers 200 again, without
        a second audit row.'
      summary: Revoke a token at once
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Tokens
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/access/v2/admin/tokens/{id}/rotate/:
    post:
      operationId: admin_tokens_rotate_create
      description: 'The raw value is in this response only (`Cache-Control: no-store`).
        The old token keeps working for `overlap_hours`. A revoked token → 409.'
      summary: 'Rotate a token: a successor with the same scopes and channel'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Access Tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRotateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRotateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRotateRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSecretResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/access/v2/me/:
    get:
      operationId: access_me
      description: 'Any authenticated user: staff get the gate mode, granted roles
        and effective area permissions; a customer gets the user block only.'
      summary: The current user's roles and effective area permissions
      tags:
      - Access Me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
        '401':
          description: No response body
components:
  schemas:
    ApplicationCreateRequest:
      additionalProperties: false
      properties:
        name:
          description: Unique display name.
          examples:
          - Storefront
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        description:
          default: ''
          description: What the application is for.
          maxLength: 1000
          title: Description
          type: string
      required:
      - name
      title: ApplicationCreateRequest
      type: object
    ApplicationListResponse:
      properties:
        count:
          title: Count
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous
        results:
          items:
            $ref: '#/components/schemas/ApplicationResponse'
          title: Results
          type: array
      required:
      - count
      - next
      - previous
      - results
      title: ApplicationListResponse
      type: object
    ApplicationResponse:
      properties:
        id:
          examples:
          - 3
          title: Id
          type: integer
        name:
          examples:
          - Storefront
          title: Name
          type: string
        description:
          title: Description
          type: string
        is_active:
          description: False stops every token of the application.
          title: Is Active
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - name
      - description
      - is_active
      - created_at
      title: ApplicationResponse
      type: object
    AreaResponse:
      properties:
        key:
          description: Area key.
          examples:
          - pim.products
          title: Key
          type: string
        label:
          description: English label; the CMS translates by key.
          examples:
          - Products and media
          title: Label
          type: string
        levels:
          description: Levels the area offers.
          examples:
          - - read
            - write
          items:
            type: string
          title: Levels
          type: array
        sensitive:
          description: Sensitivity flags.
          examples:
          - - pii
          items:
            type: string
          title: Sensitive
          type: array
        assignable:
          description: A custom role may hold it (false only for access.manage).
          title: Assignable
          type: boolean
      required:
      - key
      - label
      - levels
      - sensitive
      - assignable
      title: AreaResponse
      type: object
    AuditEntryResponse:
      properties:
        id:
          title: Id
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        actor_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Actor Id
        actor_label:
          examples:
          - admin
          title: Actor Label
          type: string
        action:
          examples:
          - grant.create
          title: Action
          type: string
        target_type:
          examples:
          - django_access.grant
          title: Target Type
          type: string
        target_id:
          title: Target Id
          type: string
        target_label:
          title: Target Label
          type: string
        detail:
          additionalProperties: true
          title: Detail
          type: object
        ip:
          anyOf:
          - type: string
          - type: 'null'
          description: Client address by the NUM_PROXIES rule.
          title: Ip
      required:
      - id
      - created_at
      - actor_id
      - actor_label
      - action
      - target_type
      - target_id
      - target_label
      - detail
      - ip
